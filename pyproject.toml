[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "helios2n"
version = "0.4.1"
description = "2N/Helios intercom integration for Home Assistant"
requires-python = ">=3.13"
dependencies = [
    "py2n==0.6.0",
]

[project.optional-dependencies]
dev = [
    "homeassistant==2026.2.0",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "ruff",
    "mypy",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

[tool.setuptools]
packages = ["custom_components.helios2n"]
